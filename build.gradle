plugins {
    id 'checkstyle'
    id "com.github.spotbugs" version "${githubSpotbugsVersion}"
    id "com.github.johnrengelman.shadow" version "${githubJohnrengelmanShadowVersion}"
    id "de.undercouch.download" version "${underCouchDownloadVersion}"
    id "net.researchgate.release" version "${researchgateReleaseVersion}"
    id 'jacoco'
}

jacoco {
    toolVersion = jacocoVersion
}

allprojects {
    group = project.group
    version = project.version

    apply plugin: 'maven-publish'

    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            url = 'https://maven.wso2.org/nexus/content/repositories/releases/'
        }
        maven {
            url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
        }
        maven {
            url = 'https://repo.maven.apache.org/maven2'
        }
        maven {
            url 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv('packageUser')
                password System.getenv('packagePAT')
            }
        }
    }

    ext {
        snapshotVersion= '-SNAPSHOT'
        timestampedVersionRegex = '.*-\\d{8}-\\d{6}-\\w.*\$'
    }
}

subprojects {
    // The Ballerina module project is built by io.ballerina.plugin, which
    // registers its own build/test/clean tasks that clash with java-library's.
    if (project.name == 'prometheus-extension-ballerina') {
        return
    }

    apply plugin: 'java-library'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    configurations {
        jbalTools {
            transitive = false
        }
        ballerinaStdLibs
    }

    dependencies {
        // Ballerina Pack
        jbalTools "org.ballerinalang:jballerina-tools:${ballerinaLangVersion}"

        // ballerina/observe + ballerinai/observe must be bundled into the test
        // distribution; every other dependency resolves from Central.
        ballerinaStdLibs "io.ballerina.stdlib:observe-ballerina:${observeVersion}"
        ballerinaStdLibs "io.ballerina:observe-ballerina:${observeInternalVersion}"
    }

    checkstyle {
        toolVersion '10.12.1'
    }

    spotbugsMain {
        def classLoader = plugins["com.github.spotbugs"].class.classLoader
        def SpotBugsConfidence = classLoader.findLoadedClass("com.github.spotbugs.snom.Confidence")
        def SpotBugsEffort = classLoader.findLoadedClass("com.github.spotbugs.snom.Effort")
        it.effort = SpotBugsEffort.MAX
        it.reportLevel = SpotBugsConfidence.LOW
        it.reports {
            xml.enabled false
            html.enabled true
        }
        def excludeFile = file('spotbugs-exclude.xml')
        if (excludeFile.exists()) {
            it.excludeFilter = excludeFile
        }
    }

    spotbugsTest {
        def classLoader = plugins["com.github.spotbugs"].class.classLoader
        def SpotBugsConfidence = classLoader.findLoadedClass("com.github.spotbugs.snom.Confidence")
        def SpotBugsEffort = classLoader.findLoadedClass("com.github.spotbugs.snom.Effort")
        it.effort = SpotBugsEffort.MAX
        it.reportLevel = SpotBugsConfidence.LOW
        it.reports {
            xml.enabled false
            html.enabled true
        }
        def excludeFile = file('spotbugs-test-exclude.xml')
        if (excludeFile.exists()) {
            it.excludeFilter = excludeFile
        }
    }

    tasks.withType(Checkstyle) {
        dependsOn ":build-config:checkstyle:downloadFiles"
        configFile rootProject.file("build-config/checkstyle/build/checkstyle.xml")
        exclude '**/module-info.java'
    }
}

def moduleVersion = project.version.replace("-SNAPSHOT", "")

release {
    failOnPublishNeeded = false
    failOnSnapshotDependencies = true

    buildTasks = ['build']
    versionPropertyFile = 'gradle.properties'
    tagTemplate = 'v$version'

    git {
        requireBranch = "release-${moduleVersion}"
        pushToRemote = 'origin'
    }
}

task codeCoverageReport(type: JacocoReport) {
    dependsOn('prometheus-extension-ballerina:extractBallerinaClassFiles')

    executionData fileTree(project.rootDir.absolutePath) {
        include "**/*.exec"
        exclude "**/jballerina-tools-*/**"
    }

    additionalClassDirs files("${buildDir}/classes")

    reports {
        xml.required = true
        html.required = true
        csv.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/jacoco/report.xml").get().asFile
        html.outputLocation = layout.buildDirectory.file("reports/jacoco/report.html").get().asFile
        csv.outputLocation = layout.buildDirectory.file("reports/jacoco/report.csv").get().asFile
    }

    onlyIf = {
        true
    }
}

if (tasks.names.contains('build')) {
    tasks.named('build') {
        dependsOn('prometheus-extension-ballerina:build')
    }
} else {
    tasks.register('build') {
        dependsOn('prometheus-extension-ballerina:build')
    }
}

