import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class BallerinaExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}

plugins {
    id 'io.ballerina.plugin'
}

description = 'Ballerina - Prometheus Extension - Ballerina Module'

def packageName = "prometheus"
def packageOrg = "ballerinax"
def tomlVersion = stripBallerinaExtensionVersion("${project.version}")
def ballerinaTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/Ballerina.toml")
def ballerinaTomlFile = new File("${project.projectDir}/Ballerina.toml")
// `bal pack` output location used by io.ballerina.plugin's build task.
def balBuildTarget = "build/bal_build_target"
// The platform directory (java21, java25, ...) is chosen by the Ballerina
// distribution in use, so it is matched instead of hardcoded.
def artifactCacheDir = file("${project.projectDir}/${balBuildTarget}/cache/${packageOrg}/${packageName}/${tomlVersion}")
def balaDir = file("${project.projectDir}/${balBuildTarget}/bala")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-');
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

ballerina {
    packageOrganization = packageOrg
    module = packageName
    langVersion = ballerinaLangVersion
    platform = 'java25'
}

configurations {
    ballerinaStdLibs
    // Consumed by the ballerina-tests project to assemble a test distribution.
    distribution {
        canBeConsumed true
        canBeResolved false
    }
}

dependencies {
    // The plugin registers its jbalTools dependency before the ballerina {}
    // extension is configured (version resolves to `null`); declaring the real
    // version here wins conflict resolution (same as module-ballerina-grpc).
    jbalTools("org.ballerinalang:jballerina-tools:${ballerinaLangVersion}") {
        transitive = false
    }

    ballerinaStdLibs "io.ballerina.stdlib:observe-ballerina:${observeVersion}"
    ballerinaStdLibs "io.ballerina:observe-ballerina:${observeInternalVersion}"
}

clean {
    delete "${project.projectDir}/target"
    delete "${project.projectDir}/Ballerina.lock"
    delete "${project.projectDir}/ballerina-internal.log"
}

task updateTomlFiles {
    doLast {
        def newConfig = ballerinaTomlFilePlaceHolder.text.replace("@project.version@", project.version)
        newConfig = newConfig.replace("@toml.version@", tomlVersion)
        ballerinaTomlFile.text = newConfig
    }
}

task commitTomlFiles {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    doLast {
        execHelper.execOperations.exec {
            ignoreExitValue true
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "git commit -m \"[Automated] Update the Ballerina.toml and Dependencies.toml\" Ballerina.toml Dependencies.toml"
            } else {
                commandLine 'sh', '-c', "git commit -m '[Automated] Update the Ballerina.toml and Dependencies.toml' Ballerina.toml Dependencies.toml"
            }
        }
    }
}

createArtifactZip {
    archiveBaseName = project.name
    archiveVersion = project.version.toString()
}

artifacts {
    distribution createArtifactZip
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact source: createArtifactZip, extension: 'zip'
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/${System.getenv("packagePublishRepo")}")
            credentials {
                username = System.getenv("packageUser")
                password = System.getenv("packagePAT")
            }
        }
    }
}

task extractBallerinaClassFiles(type: Copy) {
    dependsOn build

    from {
        fileTree(artifactCacheDir) { include 'java*/*.jar' }.collect { file ->
            zipTree(file).matching {
                exclude '**/tests/*'
                include '**/*.class'
            }
        }
    }
    into "${project.rootDir.absolutePath}/build/classes"
}

def balDistributionBin = "${project.projectDir}/build/jballerina-tools-${ballerinaLangVersion}/bin"
task publishBalaFileToLocal {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    dependsOn build

    doLast {
        // The platform in the bala name (java21, java25, ...) depends on the distribution in use.
        def balaFileName = fileTree(balaDir) {
            include "${packageOrg}-${packageName}-*-${tomlVersion}.bala"
        }.singleFile.name
        execHelper.execOperations.exec {
            workingDir project.projectDir
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "${balDistributionBin}/bal.bat push ${balBuildTarget}/bala/${balaFileName} --repository=local && exit %%ERRORLEVEL%%"
            } else {
                commandLine 'sh', '-c', "${balDistributionBin}/bal push ${balBuildTarget}/bala/${balaFileName} --repository=local"
            }
        }
    }
}

if (project.hasProperty('buildUsingDocker')) {
    def requestedDockerTag = project.findProperty('buildUsingDocker')
    def dockerTag = (requestedDockerTag == null || requestedDockerTag == '') ? 'nightly' :
            (requestedDockerTag.toString().matches(project.ext.timestampedVersionRegex) ? 'nightly' :
                    requestedDockerTag.toString())
    println("[Info] project builds on docker (patched tag resolution)")
    println("[Info] using the Ballerina docker image tag: ${dockerTag}")

    def projectDirectory = project.projectDir
    def parentDirectory = projectDirectory.parentFile
    // Matches io.ballerina.plugin's own balaArtifact path, so createArtifactZip
    // (which zips `from project.build`, i.e. this task's outputs) keeps working.
    def balaUnzipped = file("${project.projectDir}/build/bala_unzipped")
    def dockerExecHelper = project.objects.newInstance(BallerinaExecHelper)

    // Argument-list execution (no outer/inner shell) so paths containing
    // spaces can't be mis-split by sh -c/cmd -c word-splitting; -w sets the
    // container working directory instead of an inner `cd ... &&` shell
    // fragment. Same pattern ballerina-tests/build.gradle already uses for
    // its own docker `bal test` invocation. containerEnv lets callers (e.g.
    // the Central push below) pass extra -e KEY=VALUE pairs without dumping
    // the whole host environment into the container.
    def runInBallerinaContainer = { List<String> innerArgs, Map<String, String> containerEnv = [:] ->
        dockerExecHelper.execOperations.exec {
            workingDir project.projectDir
            environment "DOCKER_DEFAULT_PLATFORM", "linux/amd64"
            def envArgs = containerEnv.collectMany { key, value -> ['-e', "${key}=${value}"] }
            commandLine(['docker', 'run', '--rm', '--net=host', '-u', 'root',
                    '-v', "${parentDirectory}:/home/ballerina/${parentDirectory.name}",
                    '-v', "${projectDirectory}:/home/ballerina/${parentDirectory.name}/${projectDirectory.name}"]
                    + envArgs +
                    ['-w', "/home/ballerina/${parentDirectory.name}/${projectDirectory.name}",
                    "ballerina/ballerina:${dockerTag}"] + innerArgs)
        }
    }

    // Same needPublishToCentral guard io.ballerina.plugin's own build task
    // applies (skip for SNAPSHOT/timestamped versions, require the access
    // token) - actions.clear() below replaces that task's body entirely, so
    // without this the Docker path would pack the bala but silently never
    // push it to Central.
    def needPublishToCentral = project.hasProperty('publishToCentral') &&
            project.findProperty('publishToCentral').toString() == 'true'
    def ballerinaCentralAccessToken = System.getenv('BALLERINA_CENTRAL_ACCESS_TOKEN')

    tasks.named('build') {
        actions.clear()
        doLast {
            runInBallerinaContainer(['bal', 'pack', '--target-dir', balBuildTarget])
            fileTree("${project.projectDir}/${balBuildTarget}/bala") { include '*.bala' }.each { balaFile ->
                copy {
                    from zipTree(balaFile)
                    into new File("${balaUnzipped}/bala/${packageOrg}/${packageName}/${tomlVersion}/${ballerina.platform}")
                }
            }
            if (needPublishToCentral) {
                if (project.version.toString().endsWith('-SNAPSHOT') ||
                        project.version.toString().matches(project.ext.timestampedVersionRegex)) {
                    println("[Info] skipping publishing to central: project version is SNAPSHOT or Timestamped SNAPSHOT")
                } else if (ballerinaCentralAccessToken != null) {
                    println("[Info] Publishing to the ballerina central...")
                    def balaFileName = fileTree(balaDir) {
                        include "${packageOrg}-${packageName}-*-${tomlVersion}.bala"
                    }.singleFile.name
                    runInBallerinaContainer(['bal', 'push', "${balBuildTarget}/bala/${balaFileName}"],
                            ['BALLERINA_CENTRAL_ACCESS_TOKEN': ballerinaCentralAccessToken])
                } else {
                    throw new InvalidUserDataException('Central Access Token is not present')
                }
            }
        }
    }

    tasks.named('test') {
        actions.clear()
        doLast {
            runInBallerinaContainer(['bal', 'test'])
        }
    }
}

updateTomlFiles.dependsOn copyStdlibs
build.dependsOn updateTomlFiles
test.dependsOn updateTomlFiles
build.dependsOn "generatePomFileForMavenJavaPublication"
publish.dependsOn build
publishToMavenLocal.dependsOn build
